<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Inventory Management System</title>

    <link rel="stylesheet" href="/static/style.css" />
</head>

<body>

    <main>

        <!-- =========================================================
             HEADER
        ========================================================== -->

        <header>

            <h1>Inventory Management System</h1>

            <p>
                Manage products, prices, stock levels, and product information.
            </p>

        </header>


        <!-- =========================================================
             ERROR MESSAGE
        ========================================================== -->

        <div
            id="errorBox"
            class="error hidden">
        </div>


        <!-- =========================================================
             INVENTORY
        ========================================================== -->

        <section>

            <div class="section-header">

                <div>
                    <h2>Inventory</h2>

                    <p class="section-description">
                        View and manage all products in your inventory.
                    </p>
                </div>

                <button id="loadInventory">
                    Refresh Inventory
                </button>

            </div>


            <div id="inventoryList"></div>

        </section>


        <!-- =========================================================
             ADD PRODUCT
        ========================================================== -->

        <section>

            <h2>Add New Product</h2>

            <form id="addProductForm">

                <!-- Product name and brand -->

                <div class="row">

                    <div>

                        <label for="productName">
                            Product Name
                        </label>

                        <input
                            id="productName"
                            type="text"
                            placeholder="e.g. Organic Almond Milk"
                            required
                        />

                    </div>


                    <div>

                        <label for="brands">
                            Brand
                        </label>

                        <input
                            id="brands"
                            type="text"
                            placeholder="e.g. Silk"
                        />

                    </div>

                </div>


                <!-- Barcode, price and stock -->

                <div class="row">

                    <div>

                        <label for="barcode">
                            Barcode
                        </label>

                        <input
                            id="barcode"
                            type="text"
                            placeholder="e.g. 0123456789012"
                        />

                    </div>


                    <div>

                        <label for="price">
                            Price
                        </label>

                        <input
                            id="price"
                            type="number"
                            step="0.01"
                            min="0"
                            placeholder="e.g. 5.99"
                            required
                        />

                    </div>


                    <div>

                        <label for="stock">
                            Stock
                        </label>

                        <input
                            id="stock"
                            type="number"
                            min="0"
                            placeholder="e.g. 20"
                            required
                        />

                    </div>

                </div>


                <!-- Ingredients -->

                <div>

                    <label for="ingredients">
                        Ingredients
                    </label>

                    <textarea
                        id="ingredients"
                        placeholder="e.g. Filtered water, almonds, cane sugar"
                    ></textarea>

                </div>


                <button type="submit">
                    Add Product
                </button>

            </form>

        </section>


        <!-- =========================================================
             UPDATE PRODUCT
             This section is hidden until the user clicks Edit.
        ========================================================== -->

        <section
            id="editForm"
            class="hidden">

            <h2>Update Product</h2>

            <p>
                Updating:
                <strong id="editProductName"></strong>
            </p>


            <input
                id="editItemId"
                type="hidden"
            />


            <div class="row">

                <div>

                    <label for="editPrice">
                        Price
                    </label>

                    <input
                        id="editPrice"
                        type="number"
                        step="0.01"
                        min="0"
                        placeholder="Enter new price"
                    />

                </div>


                <div>

                    <label for="editStock">
                        Stock
                    </label>

                    <input
                        id="editStock"
                        type="number"
                        min="0"
                        placeholder="Enter new stock"
                    />

                </div>

            </div>


            <button
                id="updateProductButton"
                type="button">
                Save Changes
            </button>


            <button
                id="cancelEdit"
                type="button"
                class="secondary">
                Cancel
            </button>

        </section>


        <!-- =========================================================
             OPENFOODFACTS
        ========================================================== -->

        <section>

            <h2>Find Product</h2>

            <p class="section-description">
                Search OpenFoodFacts for additional product information
                using a barcode.
            </p>


            <div class="row">

                <div>

                    <label for="searchBarcode">
                        Barcode
                    </label>

                    <input
                        id="searchBarcode"
                        type="text"
                        placeholder="e.g. 737628064502"
                    />

                </div>


                <button
                    id="searchProductButton"
                    type="button"
                    class="secondary">
                    Find Product
                </button>

            </div>


            <div id="externalProduct"></div>

        </section>

    </main>


    <!-- =============================================================
         JAVASCRIPT
    ============================================================= -->

    <script src="/static/app.js"></script>

</body>

</html>
